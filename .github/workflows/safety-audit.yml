name: Safety Audit

on:
  push:
    paths:
      - 'kancolle-page-bridge.user.js'
      - 'kancolle-safety.user.js'
      - 'kancolle-page-bridge.chrome.user.js'
      - 'kancolle-safety.chrome.user.js'
      - 'scripts/safety-audit.mjs'
      - '.github/workflows/safety-audit.yml'
  pull_request:
    paths:
      - 'kancolle-page-bridge.user.js'
      - 'kancolle-safety.user.js'
      - 'kancolle-page-bridge.chrome.user.js'
      - 'kancolle-safety.chrome.user.js'
      - 'scripts/safety-audit.mjs'
      - '.github/workflows/safety-audit.yml'

permissions:
  contents: read

jobs:
  safety-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: |
          node --check kancolle-page-bridge.user.js
          node --check kancolle-safety.user.js
          node --check kancolle-page-bridge.chrome.user.js
          node --check kancolle-safety.chrome.user.js
      - name: Passive-only invariant audit
        run: node scripts/safety-audit.mjs
